<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DarkKitchen | Hacer Pedido</title>
    <link rel="ico" href="../img/icon.ico" />
  </head>
  <body
    style="
      font-family: &quot;Segoe UI&quot;, Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 0;
    "
  >
    <header
      style="
        background-color: #1e1e1e;
        padding: 15px 30px;
        border-bottom: 3px solid #ff6200;
        display: flex;
        justify-content: space-between;
        align-items: center;
      "
    >
      <div
        title="Logo de DarkKitchen"
        style="font-size: 24px; font-weight: bold; color: #ff6200"
      >
        DarkKitchen 🍔
      </div>
      <nav>
        <ul style="list-style-type: none; margin: 0; padding: 0">
          <li style="display: inline; margin-left: 20px">
            <a
              href="../index.html"
              title="Ir a la página de inicio"
              style="color: #ffffff; text-decoration: none; font-size: 16px"
              >Inicio</a
            >
          </li>
          <li style="display: inline; margin-left: 20px">
            <a
              href="nosotros.html"
              title="Conocer más sobre DarkKitchen"
              style="color: #ffffff; text-decoration: none; font-size: 16px"
              >Nosotros</a
            >
          </li>
          <li style="display: inline; margin-left: 20px">
            <a
              href="menu.html"
              title="Ver el menú de hamburguesas"
              style="color: #ffffff; text-decoration: none; font-size: 16px"
              >Menú</a
            >
          </li>
          <li style="display: inline; margin-left: 20px">
            <a
              href="promociones.html"
              title="Ver promociones de DarkKitchen"
              style="color: #ffffff; text-decoration: none; font-size: 16px"
              >Promociones</a
            >
          </li>
          <li style="display: inline; margin-left: 20px">
            <a
              href="contacto.html"
              title="Completar el formulario de pedido"
              style="
                color: #ff6200;
                font-weight: bold;
                text-decoration: none;
                font-size: 16px;
              "
              >Pedir Ahora</a
            >
          </li>
          <li style="display: inline; margin-left: 20px">
            <a
              href="login.html"
              title="Iniciar sesión en tu cuenta"
              style="
                color: #ffffff;
                border: 1px solid white;
                padding: 5px 10px;
                border-radius: 5px;
                text-decoration: none;
                font-size: 16px;
              "
              >Iniciar Sesión</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main style="padding: 40px; display: flex; justify-content: center">
      <section
        title="Formulario para hacer un pedido en DarkKitchen"
        style="
          background-color: #1e1e1e;
          padding: 40px;
          border-radius: 10px;
          width: 100%;
          max-width: 600px;
          border-top: 3px solid #ff6200;
        "
      >
        <h2
          style="
            color: #ff6200;
            margin-top: 0;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
          "
        >
          Completa tu Pedido
        </h2>
        <form action="#" method="POST">
          <fieldset
            style="
              border: 1px solid #333;
              border-radius: 5px;
              padding: 20px;
              margin-bottom: 30px;
            "
          >
            <legend
              style="
                color: #ff6200;
                font-weight: bold;
                padding: 0 10px;
                font-size: 1.1em;
              "
            >
              Datos de Contacto
            </legend>

            <div style="margin-bottom: 20px">
              <label
                for="nombre"
                style="
                  display: block;
                  margin-bottom: 8px;
                  font-weight: bold;
                  color: #ccc;
                "
                >Nombre Completo:</label
              >
              <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Juan Pérez"
                title="Escribe tu nombre completo"
                required
                style="
                  width: 100%;
                  padding: 10px;
                  border: 1px solid #333;
                  border-radius: 5px;
                  background-color: #2a2a2a;
                  color: white;
                  box-sizing: border-box;
                  font-family: inherit;
                "
              />
            </div>

            <div style="margin-bottom: 20px">
              <label
                for="telefono"
                style="
                  display: block;
                  margin-bottom: 8px;
                  font-weight: bold;
                  color: #ccc;
                "
                >Teléfono de Contacto:</label
              >
              <input
                type="tel"
                id="telefono"
                name="telefono"
                placeholder="555-1234-567"
                title="Escribe tu número de teléfono"
                required
                style="
                  width: 100%;
                  padding: 10px;
                  border: 1px solid #333;
                  border-radius: 5px;
                  background-color: #2a2a2a;
                  color: white;
                  box-sizing: border-box;
                  font-family: inherit;
                "
              />
            </div>
          </fieldset>

          <fieldset
            style="
              border: 1px solid #333;
              border-radius: 5px;
              padding: 20px;
              margin-bottom: 30px;
            "
          >
            <legend
              style="
                color: #ff6200;
                font-weight: bold;
                padding: 0 10px;
                font-size: 1.1em;
              "
            >
              Detalles del Pedido
            </legend>

            <div
              style="
                display: flex;
                gap: 20px;
                margin-bottom: 20px;
                flex-wrap: wrap;
              "
            >
              <div style="flex: 2; min-width: 200px">
                <label
                  for="platillo"
                  style="
                    display: block;
                    margin-bottom: 8px;
                    font-weight: bold;
                    color: #ccc;
                  "
                  >Selecciona tu Hamburguesa:</label
                >
                <select
                  id="platillo"
                  name="platillo"
                  title="Selecciona la hamburguesa que deseas pedir"
                  required
                  style="
                    width: 100%;
                    padding: 10px;
                    border: 1px solid #333;
                    border-radius: 5px;
                    background-color: #2a2a2a;
                    color: white;
                    box-sizing: border-box;
                    font-family: inherit;
                  "
                >
                  <option value="" disabled selected>
                    -- Elige una opción --
                  </option>
                  <option value="classic">Classic Smash - $150.00</option>
                  <option value="bacon">Bacon BBQ - $180.00</option>
                  <option value="doble">Monster Double - $220.00</option>
                </select>
              </div>

              <div style="flex: 1; min-width: 100px">
                <label
                  for="cantidad"
                  style="
                    display: block;
                    margin-bottom: 8px;
                    font-weight: bold;
                    color: #ccc;
                  "
                  >Cantidad:</label
                >
                <input
                  type="number"
                  id="cantidad"
                  name="cantidad"
                  min="1"
                  max="10"
                  value="1"
                  title="Elige la cantidad de hamburguesas"
                  required
                  style="
                    width: 100%;
                    padding: 10px;
                    border: 1px solid #333;
                    border-radius: 5px;
                    background-color: #2a2a2a;
                    color: white;
                    box-sizing: border-box;
                    font-family: inherit;
                  "
                />
              </div>
            </div>

            <div style="margin-bottom: 20px">
              <label
                style="
                  display: block;
                  margin-bottom: 8px;
                  font-weight: bold;
                  color: #ccc;
                "
                >Extras y Adicionales:</label
              >
              <div style="display: flex; gap: 15px; flex-wrap: wrap">
                <label
                  style="
                    color: white;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                  "
                >
                  <input
                    type="checkbox"
                    name="extras"
                    value="queso"
                    title="Agregar extra queso al pedido"
                    style="
                      margin-right: 5px;
                      accent-color: #ff6200;
                      width: 16px;
                      height: 16px;
                    "
                  />
                  Extra Queso
                </label>
                <label
                  style="
                    color: white;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                  "
                >
                  <input
                    type="checkbox"
                    name="extras"
                    value="tocino"
                    title="Agregar tocino ahumado al pedido"
                    style="
                      margin-right: 5px;
                      accent-color: #ff6200;
                      width: 16px;
                      height: 16px;
                    "
                  />
                  Tocino Ahumado
                </label>
                <label
                  style="
                    color: white;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                  "
                >
                  <input
                    type="checkbox"
                    name="extras"
                    value="papas"
                    title="Agregar una porción de papas al pedido"
                    style="
                      margin-right: 5px;
                      accent-color: #ff6200;
                      width: 16px;
                      height: 16px;
                    "
                  />
                  Porción de Papas
                </label>
              </div>
            </div>

            <div
              style="
                display: flex;
                gap: 20px;
                margin-bottom: 20px;
                flex-wrap: wrap;
              "
            >
              <div style="flex: 1; min-width: 200px">
                <label
                  style="
                    display: block;
                    margin-bottom: 8px;
                    font-weight: bold;
                    color: #ccc;
                  "
                  >Tipo de Entrega:</label
                >
                <div style="display: flex; gap: 20px; margin-top: 10px">
                  <label
                    style="
                      font-weight: normal;
                      display: inline-flex;
                      align-items: center;
                      cursor: pointer;
                      color: white;
                    "
                  >
                    <input
                      type="radio"
                      name="entrega"
                      value="domicilio"
                      checked
                      title="Recibir el pedido a domicilio"
                      style="
                        margin-right: 8px;
                        accent-color: #ff6200;
                        width: 16px;
                        height: 16px;
                      "
                    />
                    A Domicilio
                  </label>
                  <label
                    style="
                      font-weight: normal;
                      display: inline-flex;
                      align-items: center;
                      cursor: pointer;
                      color: white;
                    "
                  >
                    <input
                      type="radio"
                      name="entrega"
                      value="recoger"
                      title="Pasar a recoger el pedido"
                      style="
                        margin-right: 8px;
                        accent-color: #ff6200;
                        width: 16px;
                        height: 16px;
                      "
                    />
                    Pasar a Recoger
                  </label>
                </div>
              </div>

              <div style="flex: 1; min-width: 150px">
                <label
                  for="hora_entrega"
                  style="
                    display: block;
                    margin-bottom: 8px;
                    font-weight: bold;
                    color: #ccc;
                  "
                  >Hora de Entrega (Opcional):</label
                >
                <input
                  type="time"
                  id="hora_entrega"
                  name="hora_entrega"
                  title="Selecciona una hora de entrega opcional"
                  style="
                    width: 100%;
                    padding: 10px;
                    border: 1px solid #333;
                    border-radius: 5px;
                    background-color: #2a2a2a;
                    color: white;
                    box-sizing: border-box;
                    font-family: inherit;
                  "
                />
              </div>
            </div>

            <div style="margin-bottom: 10px">
              <label
                for="instrucciones"
                style="
                  display: block;
                  margin-bottom: 8px;
                  font-weight: bold;
                  color: #ccc;
                "
                >Instrucciones Especiales (Opcional):</label
              >
              <textarea
                id="instrucciones"
                name="instrucciones"
                rows="3"
                placeholder="Ej: Sin cebolla, extra aderezo..."
                title="Escribe instrucciones especiales para tu pedido"
                style="
                  width: 100%;
                  padding: 10px;
                  border: 1px solid #333;
                  border-radius: 5px;
                  background-color: #2a2a2a;
                  color: white;
                  box-sizing: border-box;
                  font-family: inherit;
                  resize: vertical;
                "
              ></textarea>
            </div>

            <div></div>
            <div style="margin-bottom: 10px">
              <label
                for="ubicacion"
                style="
                  display: block;
                  margin-bottom: 8px;
                  font-weight: bold;
                  color: #ccc;
                "
                >Ubicacion:</label
              >
              <a
                id="ubicacion"
                href="https://maps.app.goo.gl/WB56JtZgSfAVFi3o9"
                target="_blank"
                title="Abrir ubicación de DarkKitchen en Google Maps"
                style="color: white; text-decoration: none"
                >Encuentranos Aqui</a
              >
              <br />
              <br />
              <div style="display: flex; justify-content: center">
                <iframe
                  src="https://maps.google.com/maps?q=santo%20domingo%20ecuador&z=13&output=embed"
                  width="100%"
                  height="350"
                  title="Mapa de ubicación de DarkKitchen"
                  style="
                    max-width: 500px;
                    border: 1px solid #333;
                    border-radius: 5px;
                  "
                  allowfullscreen
                  loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"
                ></iframe>
              </div>
            </div>
          </fieldset>

          <button
            type="submit"
            title="Confirmar y enviar el pedido"
            style="
              width: 100%;
              background-color: #ff6200;
              color: white;
              padding: 15px;
              border: none;
              border-radius: 5px;
              font-weight: bold;
              font-size: 18px;
              cursor: pointer;
              margin-top: 10px;
            "
          >
            Confirmar Pedido
          </button>
        </form>
      </section>
    </main>

    <footer
      style="
        background-color: #1e1e1e;
        text-align: center;
        padding: 20px;
        border-top: 1px solid #333;
        margin-top: 40px;
      "
    >
      <p style="margin: 0">
        &copy; 2026 DarkKitchen. Proyecto Práctico de Formulario.
      </p>
    </footer>
  </body>
</html>
